<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daddy&rsquo;s week</title>
<meta name="theme-color" content="#EDEEE9">
<link rel="manifest" href="kids.webmanifest">
<link rel="apple-touch-icon" href="kids-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'">
<!-- The palette and the body type, and almost nothing else. This page draws
     none of what app.css was written for — no week list, no pay table, no nav
     bar, no dialog — but the colours are the household's and a second copy of
     them would drift (§45.3). -->
<link rel="stylesheet" href="app.css">
<style>
/* Everything this page draws, it draws itself. It is a different screen from
   the app and the viewer rather than a narrower one: one sentence, very
   large, answering the one question that gets asked out loud. */

.wrap{max-width:30rem;padding-bottom:2rem}

/* ---- the banner ----
   The whole point of the page. A child reads it from across the kitchen, so
   the number is the biggest thing on the phone and the sentence above it says
   which number it is. */
.banner{
  background:var(--card);border:1px solid var(--hair);border-radius:6px;
  padding:1.5rem 1.2rem 1.4rem;margin:0 0 1.2rem;text-align:center;
}
.banner .lbl{
  font-size:.95rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--soft);margin-bottom:.5rem;line-height:1.3;
}
/* Scaled to the phone rather than fixed. "in about 5 hours" at a flat
   2.6rem is wider than a 390px screen, and the first draft of this page
   overflowed the viewport — which does not merely clip the sentence, it
   widens the document, so every card below it was drawn off the right edge
   too. `clamp` keeps it as large as it can be on the phone in hand. */
.banner .big{
  font-size:clamp(1.8rem, 8.5vw, 2.6rem);
  font-weight:700;line-height:1.1;letter-spacing:-.02em;color:var(--ink);
  overflow-wrap:break-word;
}
.banner .sub{font-size:1rem;color:var(--soft);margin-top:.6rem}

/* Out of the house. The one state where the answer to "where is he" is not
   "here", and it is worth the page looking different rather than only reading
   differently — a child checking from the hallway sees the colour first. */
.banner.out{background:var(--wash);border-color:var(--signal)}
.banner.out .lbl{color:var(--deep)}
.banner.home .big{color:var(--ink)}

/* ---- the week ---- */
h2.wk{font-size:.95rem;font-weight:600;color:var(--soft);margin:0 0 .5rem;
      letter-spacing:.04em;text-transform:uppercase}
.day{
  display:flex;gap:.9rem;align-items:flex-start;
  background:var(--card);border:1px solid var(--hair);border-radius:4px;
  padding:.7rem .8rem;margin-bottom:.5rem;
}
.day.today{border-color:var(--signal);border-left-width:4px}
.day .dn{min-width:4.2rem}
.day .dn b{display:block;font-size:1rem;font-weight:600}
.day .dn span{display:block;font-size:.8rem;color:var(--soft)}
.day .what{flex:1}
/* Two lines a shift: when he goes, when he is back. Written as the child's
   day rather than the employer's — "leaves" and "home", not "start" and
   "end", and the padded times rather than the shift's own (§46.2). */
/* One of these a shift, so that a double shift reads as two goings-out and
   not as four lines of times. Thursday in the test week is exactly that:
   four hours at one job, then an evening at the other. */
.trip + .trip{margin-top:.6rem;padding-top:.6rem;border-top:1px solid var(--hair)}
.go{font-size:1rem;line-height:1.5}
.go b{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-weight:600}
.go + .go{margin-top:.15rem}
.go .tag{color:var(--soft)}
.off{font-size:1rem;color:var(--soft)}
.job{font-size:.8rem;color:var(--soft);margin-top:.25rem;display:flex;
     gap:.4rem;align-items:center}
.job i{width:.55rem;height:.55rem;border-radius:50%;display:inline-block;flex:none}

/* ---- the quiet line ----
   Same job as the viewer's as-of line (§45): with no way to add a shift, an
   empty week and a fetch that failed on Tuesday look identical. It says
   nothing while it is fresh, because a child cannot act on "checked 4 minutes
   ago" and should not be asked to read it. */
.asof{font-size:.85rem;color:var(--soft);margin:1.2rem 0 0;text-align:center}
.asof.cold{color:var(--bad)}
.asof button{
  background:none;border:1px solid var(--rule);color:inherit;
  font-family:inherit;font-size:.8rem;padding:.15rem .5rem;border-radius:2px;
  cursor:pointer;margin-left:.4rem;
}

/* ---- the door ---- */
.gate input{width:100%;font-family:"IBM Plex Mono",monospace;font-size:.9rem}
.gate .err{color:var(--bad);font-size:.85rem;margin:.5rem 0 0}
</style>
</head>
<body>
<div class="wrap">

<!-- The door. Set up once, by the grown-up holding the link, and never seen
     again on that phone. -->
<section id="tab-gate" hidden>
  <h1>Daddy&rsquo;s week</h1>
  <div class="card gate">
    <p class="tiny soft" style="margin-top:0">This phone shows when Daddy leaves
      for work and when he gets home, for the next week. It cannot show or
      change anything else.</p>
    <label class="f"><span>Code</span>
      <input id="tok" type="password" inputmode="text" autocomplete="off"
             spellcheck="false" placeholder="paste it here"></label>
    <div class="rowbtns"><button class="act" id="unlock">Go</button></div>
    <p class="err" id="gateerr" hidden></p>
  </div>
</section>

<!-- The page. -->
<section id="tab-week" hidden>
  <div class="banner" id="banner"></div>
  <h2 class="wk">The next seven days</h2>
  <div id="week"></div>
  <div class="asof" id="asof"></div>
</section>

</div>

<!-- One script, and it is the whole page. No parser, no ICS reader, no
     patterns, no sites, no merge — and, the one that matters, no pay.js. The
     arithmetic that turns hours into money is not loaded on this phone at all,
     which is a stronger statement than a hidden tab and a shorter file than
     the argument for it (§46.1). -->
<script src="kids.js"></script>
</body>
</html>
